name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  locks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - run: python -m pip install -r tools/requirements-uv.txt
      - run: python tools/lock_requirements.py --check

  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - uses: actions/setup-node@v4   # builds and type-checks the frontend; runs tests/js
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run check   # tsc
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Verify the standalone runtime lock
        run: |
          python -m venv .venv-runtime
          .venv-runtime/bin/python -m pip install --require-hashes --only-binary=:all: -r requirements.txt
          .venv-runtime/bin/python -m pip check
          .venv-runtime/bin/python server.py --help
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.txt
      - run: python -m pip check
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: python -m pytest -q --cov --durations=20 -o faulthandler_timeout=60
