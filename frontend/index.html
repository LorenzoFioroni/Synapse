<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg?v=3">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png?v=3">
  <link rel="shortcut icon" href="/favicon.ico?v=3">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- Add to Home Screen on an iPad / phone. It opens Synapse in Safari rather than as a
       stand-alone web app: PDFs open in tabs of their own, and a stand-alone app would not share
       Safari's cookie that keeps the device paired. -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Synapse">
  <meta name="theme-color" content="#cc2936">
  <title>Library — Synapse</title>

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/items.css">
  <link rel="stylesheet" href="css/itempane.css">
  <link rel="stylesheet" href="css/settings.css">
  <link rel="stylesheet" href="css/notes.css">
  <link rel="stylesheet" href="css/tasks.css">
  <link rel="stylesheet" href="css/graph.css">
  <link rel="stylesheet" href="vendor/md/katex/katex.min.css">
  <script>
    // apply the cached theme before first paint to avoid a white flash
    try {
      const t = localStorage.getItem('zc.themeHint');
      if (t) document.documentElement.dataset.theme = JSON.parse(t);
    } catch (e) {}
  </script>
</head>
<body>
  <div id="tabbar" hidden></div>
  <header id="toolbar"></header>
  <div id="app">
    <nav id="sidebar" aria-label="Collections"></nav>
    <main id="items-pane"></main>
    <div id="resizer-right" class="pane-resizer" title="Drag to resize, double-click to hide"></div>
    <aside id="item-pane" aria-label="Item details"></aside>
  </div>
  <footer id="statusbar"></footer>
  <div id="tab-views" hidden></div>
  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
