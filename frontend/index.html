<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg?v=2">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png?v=2">
  <link rel="shortcut icon" href="/favicon.ico?v=2">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library — Zotero Clone</title>

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/items.css">
  <link rel="stylesheet" href="css/itempane.css">
  <link rel="stylesheet" href="css/settings.css">
  <link rel="stylesheet" href="css/notes.css">
  <link rel="stylesheet" href="css/graph.css">
  <link rel="stylesheet" href="vendor/md/katex/katex.min.css">
  <script>
    // apply the cached theme before first paint to avoid a white flash
    try {
      const t = localStorage.getItem('zc.themeHint');
      if (t) document.documentElement.dataset.theme = JSON.parse(t);
    } catch (e) {}
  </script>
</head>
<body>
  <header id="toolbar"></header>
  <div id="app">
    <nav id="sidebar" aria-label="Collections"></nav>
    <main id="items-pane"></main>
    <div id="resizer-right" class="pane-resizer" title="Drag to resize, double-click to hide"></div>
    <aside id="item-pane" aria-label="Item details"></aside>
  </div>
  <footer id="statusbar"></footer>
  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
