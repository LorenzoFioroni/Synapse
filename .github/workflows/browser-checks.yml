name: Browser checks

on:
  schedule:
    - cron: "23 2 * * *"  # nightly, UTC
  workflow_dispatch:
    inputs:
      browser:
        description: Browser suite
        type: choice
        options: [both, chromium, webkit]
        default: both
  pull_request:

permissions:
  contents: read

concurrency:
  group: browser-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      needed: ${{ steps.select.outputs.needed }}
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: select
        name: Select affected checklists
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          BROWSER: ${{ inputs.browser || 'both' }}
        run: python tools/browser_scope.py --event "$EVENT" --base "$BASE" --head "$HEAD" --browser "$BROWSER" >> "$GITHUB_OUTPUT"
  browser:
    needs: scope
    if: needs.scope.outputs.needed == 'true'
    name: ${{ matrix.browser }} checklists
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.scope.outputs.matrix) }}
    env:
      E2E_BROWSER: ${{ matrix.browser }}
      PYTHONUNBUFFERED: "1"
      SYNAPSE_E2E_LIST_READY_SECONDS: "3"
      SYNAPSE_E2E_LIST_STEP_MS: "50"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            tools/requirements-e2e.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.txt
      - run: python -m pip install -r tools/requirements-e2e.txt
      - run: python -m pip check
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Install browser and system dependencies
        run: python -m playwright install --with-deps "$E2E_BROWSER"
      - name: Run checklists without retries
        env:
          CHECKLISTS: ${{ toJSON(matrix.checklists) }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          names = json.loads(os.environ["CHECKLISTS"])
          subprocess.run([sys.executable, "tests/e2e/run.py", "--browser", os.environ["E2E_BROWSER"],
                          "--output-dir", "browser-results", *names], check=True)
          PY
      - name: Publish checklist summary
        if: always()
        run: |
          if [ -f browser-results/summary.md ]; then
            cat browser-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-results-${{ matrix.browser }}
          path: browser-results/
          if-no-files-found: warn
          retention-days: 7
