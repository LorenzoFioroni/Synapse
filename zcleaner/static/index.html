<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="token" content="__TOKEN__">
<title>Zotero Library Cleaner</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23b3261e'/%3E%3Cpath d='M9 9h14l-11 14h11' stroke='white' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="shell">
  <aside class="nav">
    <div class="brand"><span class="logo">Z</span><div><b>Library Cleaner</b><small>review before write</small></div></div>
    <nav id="nav">
      <a data-view="dashboard" href="#dashboard">Dashboard</a>
      <a data-view="review" href="#review">Review changes <span class="count" id="c-pending"></span></a>
      <a data-view="issues" href="#issues">Issues <span class="count" id="c-issues"></span></a>
      <a data-view="duplicates" href="#duplicates">Duplicates <span class="count" id="c-dups"></span></a>
      <a data-view="pdfs" href="#pdfs">PDFs <span class="count" id="c-pdfs"></span></a>
      <a data-view="tags" href="#tags">Semantic Tags</a>
      <a data-view="apply" href="#apply">Apply to Zotero <span class="count accent" id="c-accepted"></span></a>
      <a data-view="history" href="#history">History &amp; roll-back</a>
      <a data-view="settings" href="#settings">Settings</a>
    </nav>
    <div class="conn" id="conn"></div>
    <div class="kbd-help">Keys in Review: <kbd>j</kbd>/<kbd>k</kbd> move · <kbd>a</kbd> accept · <kbd>r</kbd> reject · <kbd>e</kbd> edit · <kbd>u</kbd> undo · <kbd>A</kbd> accept item</div>
  </aside>
  <main>
    <div class="jobbar hidden" id="jobbar">
      <div class="jobtext"><span class="spinner"></span><span id="jobmsg"></span></div>
      <div class="progress"><div id="jobprog"></div></div>
      <button class="ghost small" id="jobcancel">Cancel</button>
    </div>
    <div id="view"></div>
  </main>
  <aside class="drawer hidden" id="drawer"></aside>
</div>
<div class="toast" id="toast"></div>
<div class="modal hidden" id="modal"><div class="modal-card" id="modal-card"></div></div>
<script src="/static/app.js"></script>
</body>
</html>
