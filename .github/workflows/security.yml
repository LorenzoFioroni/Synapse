name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 6 * * 1" # advisory databases can change without a code change
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned Gitleaks
        env:
          VERSION: "8.30.1"
          SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          curl --fail --location --retry 3 "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "$SHA256  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Scan new PR commits or full main history
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            "$RUNNER_TEMP/gitleaks" git --redact=100 --log-opts="$BASE..$HEAD" .
          else
            "$RUNNER_TEMP/gitleaks" git --redact=100 .
          fi
  python-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            tools/requirements-*.txt
      - name: Resolve the locked app and optional development tools
        run: |
          python -m pip install --upgrade pip setuptools
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev.txt
          python -m pip install --only-binary=:all: -r tools/requirements-e2e.txt -r tools/requirements-uv.txt
          python -m pip check
          python -m pip list --format=freeze > "$RUNNER_TEMP/dependencies.txt"
      - name: Use supported Python for the isolated auditor
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Audit the resolved environment with an isolated auditor
        run: |
          python -m venv "$RUNNER_TEMP/auditor"
          "$RUNNER_TEMP/auditor/bin/python" -m pip install --only-binary=:all: pip-audit==2.10.1
          "$RUNNER_TEMP/auditor/bin/python" -m pip_audit --no-deps --disable-pip -r "$RUNNER_TEMP/dependencies.txt"
  npm-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Audit the lockfile without installing or running package scripts
        run: |
          python - <<'PY'
          import subprocess, sys
          failed = False
          for folder in ["frontend", "tools/cm6", "tools/graph", "tools/md"]:
              print(f"Auditing {folder}", flush=True)
              result = subprocess.run(["npm", "--prefix", folder, "audit", "--package-lock-only",
                                       "--ignore-scripts", "--audit-level=high"])
              failed |= result.returncode != 0
          sys.exit(int(failed))
          PY
