title = "Synapse secret scan"

[extend]
useDefault = true

[[allowlists]]
description = "Known citation-key fixtures, including their historical location"
condition = "AND"
paths = ['''^(clone_app/)?tests/(js/library\.test\.mjs|test_formats\.py)$''']
regexTarget = "match"
regexes = ['''(?:key: '(?:cuiVariational2015|zhangSmith2019)'|citation_key": "mendozaarenasAsymmetry2019")''']

[[allowlists]]
description = "Mermaid's minified atlas-count expression is code, not a credential"
condition = "AND"
paths = ['''^frontend/vendor/mermaid/mermaid\.min\.js$''']
regexTarget = "match"
regexes = ['''(?:p\.keyCount,v=p\.atlasCount|m\.keyCount,v=m\.atlasCount)''']

[[allowlists]]
description = "The extension's public key pins its id for native messaging; it is public by design"
condition = "AND"
paths = ['''^browser_extension/manifest\.json$''']
regexTarget = "match"
regexes = ['''^key": "MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEA''']

[[allowlists]]
description = "Companion test fixture: base64 of not-a-real-key"
condition = "AND"
paths = ['''^tests/test_companion_(app|cli)\.py$''']
regexTarget = "match"
regexes = ['''bm90LWEtcmVhbC1rZXk=''']
